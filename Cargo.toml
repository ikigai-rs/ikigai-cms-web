[package]
name = "ikigai-cms-web"
version = "0.0.0"
edition = "2021"
publish = false
description = "The semantic-CMS reading room: a WebTransport-served kernel over the CMS graph, with an htmx + WebGPU browser front-end. Rung 1 = build_cms_kernel composes the bookmark graph (org → Turtle) + SPARQL over it."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ikigai-rs/ikigai-cms-web"

[lib]
# cdylib for the browser wasm codec (via wasm-bindgen); rlib for the native bin, the
# examples, and the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared across native and wasm: the request/reply types + the on-wire codec both
# faces speak, and JSON (render on native, arg encoding on wasm).
# 0.1.58 is a REAL floor: `ikigai_core::config` is the one spelling of both ikigai homes
# (config_home_from arrived in 0.1.56, data_home_from/data_path in 0.1.57) and this crate
# now derives every home from it rather than joining ".config/ikigai" and ".ikigai" itself.
# The pin says 0.1.58, not 0.1.57, because 0.1.57 was never published — the registry goes
# 0.1.56 → 0.1.58 — so 0.1.58 is the earliest version that actually resolves.
ikigai-core = "0.1.58"
# The on-wire Call/Reply codec — the SAME bytes ikigai-ipc/quic speak. The server
# encodes/decodes it natively; the browser's wire codec does it in wasm.
# 0.1.10 is a REAL floor, not caution: `handle` matches `Call::IssueTraced`, which
# protocol v3 added and 0.1.9 does not have. A bare "0.1" resolved to 0.1.9 under the
# old lock, so `cargo build` (locked) and `cargo install --path` (fresh) compiled
# different source and disagreed about what existed.
ikigai-wire = "0.1.10"
serde_json = "1"

# The native kernel + server. Gated off wasm — the browser links only the wire codec,
# never the SPARQL/fs stack.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The CMS transreptors (urn:cms:*): bookmarks_to_turtle + the space().
# 0.1.2 = skolemized subjects (urn:cms:bookmark:*), URL as dc:identifier.
# 0.1.4 is a REAL floor (audit round 5, ledger #876): every heading is a record boundary, TODO/DONE
# and a priority cookie before the link are accepted, a wrapped URL joins with no space, a BOM is
# stripped, and org's link escapes come off before the identifier is taken. The room's
# remove-by-URL (maintenance.rs `strike`) now asks THIS parser which URL a heading carries, so the
# URL it strikes is exactly the dc:identifier the graph serves (ledger #882).
ikigai-cms = "0.1.4"
# Read back the Turtle ikigai-cms emits: `strike` (maintenance.rs) asks ikigai-cms which URL a
# heading carries by transrepting the record and reading its dc:identifier, rather than parsing
# org a second time (ledger #882). Both are already in the graph through ikigai-sparql's Oxigraph;
# 0.2.0/0.3.0 are the first releases with `TurtleParser::for_slice` and the Term this matches.
# Optional: only the maintenance feature (which owns `strike`) links them.
oxttl = { version = "0.2.0", optional = true }
oxrdf = { version = "0.3.0", optional = true }
# SPARQL over graph=<uri> sources resolved through the kernel (Oxigraph in-memory).
ikigai-sparql = "0.1.5"
# XSLT transform (urn:xslt:transform, xrust) — the view pipes its CONSTRUCT'd RDF/XML
# through a `urn:cms:style:*` stylesheet to render cards. Native/server-side only.
ikigai-xslt = "0.1.0"
# Capability-gated, cacheable, golden-threaded file reads for the CMS source jail.
ikigai-fs = "0.1.8" # security floor (audit round 3, ledger #856): the jail authorizes the file it opens
# Endpoint::invoke is async (dyn via async-trait) — the assembly + view endpoints read
# through the kernel.
async-trait = "0.1"
# Resolver::issue drives a request against the kernel (the server bin, examples, tests).
ikigai-resolve = "0.1.9"
# The WebTransport server (rung 2). Behind the `server` feature so the default build
# and CI (lib + tests) stay lean; a dedicated CI step builds `--features server`.
wtransport = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"], optional = true }
# Rung 3b: the server-side WebAuthn relying party. Verifies a passkey assertion and maps
# the credential to its granted capability scopes (the connection's ceiling).
webauthn-rs = { version = "0.5.5", optional = true }
url = { version = "2", optional = true }                                   # rp_origin
uuid = { version = "1", features = ["v4"], optional = true }               # user handle
serde = { version = "1", features = ["derive"], optional = true }          # the {Passkey → scopes} store
# rung 3c: the passkey store lives in the OS keystore (macOS Keychain), not plaintext;
# 0.1.1 adds require_biometric (Touch ID) to gate enrollment; 0.1.6 is the floor because the
# secret space became THREE enumerable endpoints there (the store plus generate and unlock)
# and tests/conformance.rs asserts the maintenance catalog exactly — under 0.1.5 that list is
# a different set and the walk fails.
ikigai-secret = { version = "0.1.8", optional = true } # security floor (ledger #854 at 0.1.7: 0600 atomic, injective names; ledger #874 at 0.1.8: a name beginning with `-` is refused at every face)
# Maintenance: the link-checker resolves urn:httpHead+Exists through the kernel. 0.1.6 = lenient
# Exists (a server that answers anything but 404/410 is reachable → 429/5xx = alive, only a transport
# failure is unreachable), atop 0.1.5's honest status + caller `max_age` freshness directive.
ikigai-http = { version = "0.1.6", optional = true }
# An ASYNC outbound transport for it: reqwest parks on its I/O, so the kernel resolves
# thousands of HEAD checks concurrently on one runtime (no thread pool). rustls to avoid a
# system OpenSSL dep in CI.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }
# buffer_unordered for the bounded concurrent fan-out.
futures = { version = "0.3", optional = true }
# A runtime-agnostic timer for the transient-failure retry backoff (works under tokio or the
# urn:time timer thread alike).
futures-timer = { version = "3", optional = true }
# The time transport: cms-server schedules the link-check pass on a recurring urn:time job.
# 0.2.0 runs a job's cancel closure OUTSIDE the registry lock: before it, a panic in any cancel
# closure poisoned the registry mutex and every later `lock().expect(..)` in the crate died with
# it — the long-lived registry this server holds is exactly the thing that would have stayed
# dead. 0.2.0 also takes the host's Clock as a required argument (see `JobRegistry::new` in
# src/bin/server.rs), which is what makes this pin a floor rather than a preference.
# 0.4 is a REAL floor and the `0.2.0` it replaces was a CEILING (`^0.2.0` = `<0.3.0`; ledger #141):
# 0.4.0 (ledger #79) makes `schedule_persistent` take the capability a job fires under as a
# REQUIRED argument, which server.rs now passes. `JobRegistry::new(backend, clock)` is unchanged
# across 0.2 → 0.4 (checked against both sources). 0.3.0's awake-time job health
# (`with_sleep_clock`, public `JobHealth`) is now reachable, but this host reads no health yet.
ikigai-time = { version = "0.4.1", optional = true }
# S3 tag suggestion: urn:llm:ask over a local Ollama (OpenAI-compat) refines the noisy OpenLibrary
# subjects onto the user's tag vocabulary; urn:llm:ollama:up gates the pass on the LLM being up.
# Reuses the same HttpTransport as the link-checker.
# 0.12 is a REAL floor, and the `0.7` it replaces was a CEILING: `^0.7` on a 0.x crate means
# `>=0.7.0, <0.8.0`, so this pin could not see 0.8 through 0.12 at all and the room served the
# 0.7 line of `urn:llm:*` for months without saying so. The floor is 0.12 because the
# conformance walk asserts the catalog EXACTLY: 0.10.0 binds `urn:llm:{provider}:model`
# (a fourth per-provider endpoint the walk must list) and 0.12.1 adopted ikigai-conformance,
# which is what makes the inherited-finding partition in tests/conformance.rs true.
# 0.11.0 also made `OpenAiConfig::default_model` an `Option` — this crate builds its registry
# through `OpenAiConfig::ollama` / `Registry::single` / `Registry::from_json`, never a struct
# literal, so that break does not reach here.
# 0.13.0 is the audit round 5 release (ledger #884), and a ceiling bump: `^0.12` could not see it.
# It enforces the PORT of a net grant, sends a provider's key on every request, redacts URL
# credentials, stops caching answers built from a live probe, and REFUSES registries it used to
# load silently (a `default` naming no provider, unknown cost values). The API this crate calls
# (`OpenAiConfig::ollama`, `Registry::{single, from_json}`, `space`) is unchanged.
ikigai-llm = { version = "0.13.0", optional = true }
# Bin configuration lives in ~/.config/ikigai/cms.toml (+ CLI flags) — never env vars.
toml = { version = "0.8", optional = true }

# The browser wire codec (encodeIssue / decodeReply) — wasm only.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.108"

[features]
# The native WebTransport server + WebAuthn relying party. Off by default (keeps the
# wasm/browser build and the fast CI lean); enable for `cms-server`.
# The server includes the maintenance stack + the time transport so it can schedule the
# link-check pass (urn:time) alongside serving the room.
server = ["dep:wtransport", "dep:tokio", "dep:webauthn-rs", "dep:url", "dep:uuid", "dep:serde", "dep:ikigai-secret", "maintenance", "dep:ikigai-time"]
# The graph-maintenance tools (link-checker). Off by default; a dedicated bin.
# serde derives the persisted link-status cache (the reconcile state across runs);
# tokio runs the async fan-out; reqwest + futures back it.
# ikigai-secret: the Zotero link pass reads its API key as `urn:secret:zotero-api-key` through the
# kernel, so the maintenance kernel mounts the secret space (the server feature already had the dep
# for the passkey store; maintenance needs it in its own right).
maintenance = ["dep:ikigai-http", "dep:ikigai-llm", "dep:oxttl", "dep:oxrdf", "dep:ikigai-secret", "dep:reqwest", "dep:futures", "dep:futures-timer", "dep:tokio", "dep:serde", "dep:toml"]

[[bin]]
name = "cms-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "cms-linkcheck"
path = "src/bin/linkcheck.rs"
required-features = ["maintenance"]

[[bin]]
name = "cms-tag-suggest"
path = "src/bin/tagsuggest.rs"
required-features = ["maintenance"]

[[bin]]
name = "cms-zotero-links"
path = "src/bin/zoterolinks.rs"
required-features = ["maintenance"]

[dev-dependencies]
futures = "0.3"
# A throwaway source jail for the hermetic integration test.
tempfile = "3"
# The module recipe as one test (tests/conformance.rs). Its floor is ikigai-core 0.1.67
# (`Kernel::entries` lists the kernel's own operations), above the library's 0.1.58 pin — so
# the lock resolves ONE core at 0.1.67 for the whole graph. The library's pin stays the true
# minimum of the API it uses; a dev-dependency raises the lock, not the contract.
# 0.5.1, not the 0.3.0 the brief named: `^0.2.0` and `^0.3.0` are each a CEILING under 0.x rules,
# so either would hold the room to an old definition of "done". 0.5.1 is the current one; it
# requires ikigai-core 0.1.85, so the lock now resolves core there.
ikigai-conformance = "0.5.1"
