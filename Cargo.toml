[package]
name = "ikigai-cms-web"
version = "0.0.0"
edition = "2021"
publish = false
description = "The semantic-CMS reading room: a WebTransport-served kernel over the CMS graph, with an htmx + WebGPU browser front-end. Rung 1 = build_cms_kernel composes the bookmark graph (org → Turtle) + SPARQL over it."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ikigai-rs/ikigai-cms-web"

[lib]
# cdylib for the browser wasm codec (via wasm-bindgen); rlib for the native bin, the
# examples, and the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared across native and wasm: the request/reply types + the on-wire codec both
# faces speak, and JSON (render on native, arg encoding on wasm).
ikigai-core = "0.1.46"
# The on-wire Call/Reply codec — the SAME bytes ikigai-ipc/quic speak. The server
# encodes/decodes it natively; the browser's wire codec does it in wasm.
ikigai-wire = "0.1"
serde_json = "1"

# The native kernel + server. Gated off wasm — the browser links only the wire codec,
# never the SPARQL/fs stack.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The CMS transreptors (urn:cms:*): bookmarks_to_turtle + the space().
# 0.1.2 = skolemized subjects (urn:cms:bookmark:*), URL as dc:identifier.
ikigai-cms = "0.1.2"
# SPARQL over graph=<uri> sources resolved through the kernel (Oxigraph in-memory).
ikigai-sparql = "0.1.5"
# XSLT transform (urn:xslt:transform, xrust) — the view pipes its CONSTRUCT'd RDF/XML
# through a `urn:cms:style:*` stylesheet to render cards. Native/server-side only.
ikigai-xslt = "0.1.0"
# Capability-gated, cacheable, golden-threaded file reads for the CMS source jail.
ikigai-fs = "0.1.4"
# Endpoint::invoke is async (dyn via async-trait) — the assembly + view endpoints read
# through the kernel.
async-trait = "0.1"
# Resolver::issue drives a request against the kernel (the server bin, examples, tests).
ikigai-resolve = "0.1.9"
# The WebTransport server (rung 2). Behind the `server` feature so the default build
# and CI (lib + tests) stay lean; a dedicated CI step builds `--features server`.
wtransport = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"], optional = true }
# Rung 3b: the server-side WebAuthn relying party. Verifies a passkey assertion and maps
# the credential to its granted capability scopes (the connection's ceiling).
webauthn-rs = { version = "0.5.5", optional = true }
url = { version = "2", optional = true }                                   # rp_origin
uuid = { version = "1", features = ["v4"], optional = true }               # user handle
serde = { version = "1", features = ["derive"], optional = true }          # the {Passkey → scopes} store
# rung 3c: the passkey store lives in the OS keystore (macOS Keychain), not plaintext.
ikigai-secret = { version = "0.1.0", optional = true }

# The browser wire codec (encodeIssue / decodeReply) — wasm only.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.108"

[features]
# The native WebTransport server + WebAuthn relying party. Off by default (keeps the
# wasm/browser build and the fast CI lean); enable for `cms-server`.
server = ["dep:wtransport", "dep:tokio", "dep:webauthn-rs", "dep:url", "dep:uuid", "dep:serde", "dep:ikigai-secret"]

[[bin]]
name = "cms-server"
path = "src/bin/server.rs"
required-features = ["server"]

[dev-dependencies]
futures = "0.3"
# A throwaway source jail for the hermetic integration test.
tempfile = "3"
