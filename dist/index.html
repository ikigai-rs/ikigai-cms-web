<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ikigai — reading room</title>
<style>
  :root { --bg:#faf8f3; --fg:#26241f; --mut:#8a857b; --line:#e6e1d6; --card:#fff; --accent:#185fa5; --accent-bg:#e6f1fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1917; --fg:#e9e5dc; --mut:#9a958a; --line:#2f2c27; --card:#232019; --accent:#7fb2ee; --accent-bg:#12314f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 20px 64px; }
  header.top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  header.top h1 { font-size:18px; font-weight:500; margin:0; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:none; border-right:1px solid var(--line); background:transparent; color:var(--mut); padding:6px 11px; font:13px system-ui; cursor:pointer; }
  .seg button:last-child { border-right:none; }
  .seg button[aria-pressed=true] { background:var(--card); color:var(--fg); font-weight:500; }
  .auth button { border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); padding:6px 11px; font:13px system-ui; cursor:pointer; margin-left:6px; }
  .auth button:hover { background:var(--card); }
  .status { margin-left:auto; font:12px ui-monospace, monospace; color:var(--mut); }
  .status.err { color:#c0392b; }
  .connect { border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--card); margin-top:12px; }
  .connect code { background:var(--accent-bg); color:var(--accent); padding:1px 6px; border-radius:5px; font-size:13px; }
  .connect input { width:100%; margin-top:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:13px ui-monospace, monospace; }
  nav.nav { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0 0; }
  nav.nav[hidden] { display:none; }
  nav.nav button { border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); padding:5px 12px; font:13px system-ui; cursor:pointer; }
  nav.nav button:hover { background:var(--card); }
  nav.nav form { margin-left:auto; display:flex; }
  nav.nav input { padding:6px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:13px system-ui; width:190px; }
  #room { margin-top:16px; }
  /* variables the server-rendered stylesheets (tags.xsl etc.) read for theming */
  #room { --cms-border:var(--line); --cms-accent-soft:var(--accent-bg); }
  .cms-error { color:#c0392b; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>ikigai reading room</h1>
    <div class="seg" role="group" aria-label="stylesheet">
      <button data-style="catalog" aria-pressed="true">catalog</button>
      <button data-style="mosaic" aria-pressed="false">mosaic</button>
      <button data-style="agenda" aria-pressed="false">agenda</button>
    </div>
    <div class="auth">
      <button id="signin">sign in</button>
      <button id="register">register passkey</button>
    </div>
    <span class="status" id="status">not connected</span>
  </header>

  <nav class="nav" id="nav" hidden>
    <button data-view="urn:cms:view:quic">home</button>
    <button data-view="urn:cms:tags">tags</button>
    <form id="search">
      <input id="q" type="search" placeholder="search titles…" autocomplete="off" spellcheck="false" />
    </form>
  </nav>

  <div class="connect" id="connect">
    <p style="margin:0">Start the server and connect. In the repo:</p>
    <p style="margin:6px 0 0"><code>cargo run --features server --bin cms-server -- 4433 ~/Dropbox/org-mode-files</code></p>
    <p style="margin:10px 0 0; font-size:14px; color:var(--mut)">Paste the printed <code>cert sha-256</code> (or open this page with <code>#cert=&lt;hash&gt;</code>), optionally <code>&amp;port=4433</code>:</p>
    <input id="cert" placeholder="cert sha-256 hex" autocomplete="off" spellcheck="false" />
  </div>

  <div id="room"></div>
</div>

<script type="module">
import init, { encodeIssue, decodeReply } from './ikigai_cms_web.js';

const $ = (s) => document.querySelector(s);
const statusEl = $('#status'), room = $('#room'), connect = $('#connect');
const setStatus = (t, err) => { statusEl.textContent = t; statusEl.classList.toggle('err', !!err); };
const hexToBytes = (h) => new Uint8Array((h.match(/../g) || []).map((b) => parseInt(b, 16)));
const params = new URLSearchParams(location.hash.slice(1));
const START_VIEW = 'urn:cms:view:quic';

let wt = null;
let currentStyle = 'catalog';   // the named urn:cms:style:* the view renders through
let currentView = START_VIEW;   // the current view resource, re-rendered on restyle
let currentArgs = {};           // its extra args (e.g. a search `q`), preserved on restyle
let signedIn = false;           // a verified passkey has raised the server ceiling

async function readAll(readable) {
  const reader = readable.getReader(), chunks = [];
  let n = 0;
  for (;;) { const { value, done } = await reader.read(); if (done) break; chunks.push(value); n += value.length; }
  const out = new Uint8Array(n); let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

// One ikigai-wire Call on its own bidi stream → the decoded reply string (HTML).
async function wireCall(bytes) {
  const stream = await wt.createBidirectionalStream();
  const writer = stream.writable.getWriter();
  await writer.write(bytes); await writer.close();
  return decodeReply(await readAll(stream.readable));
}

// Resolve a view over the wire, rendered through the current stylesheet, and swap it
// into #room. The style rides as an arg — urn:cms:view:{tag} runs the CONSTRUCT and
// pipes it through urn:cms:style:{style} server-side; the browser just swaps the HTML.
async function loadView(iri, extra) {
  currentView = iri;
  currentArgs = extra || {};
  const args = Object.assign({ style: currentStyle }, currentArgs);
  const bytes = encodeIssue(iri, JSON.stringify(args));
  if (!bytes.length) { room.innerHTML = '<p class="cms-error">bad iri: ' + iri + '</p>'; return; }
  room.innerHTML = await wireCall(bytes);
}

// A minimal htmx: a click on a tag chip ([hx-get]) re-queries the graph for that tag.
// The markup is htmx-native, so real htmx is a drop-in (its request routed to the wire).
room.addEventListener('click', (e) => {
  const el = e.target.closest('[hx-get]');
  if (!el) return;
  e.preventDefault();
  loadView(el.getAttribute('hx-get'));
});

// Restyle = re-fetch the current view naming a different stylesheet resource. The look
// is data: the server renders the same graph through a different XSLT.
document.querySelectorAll('.seg button').forEach((b) =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    currentStyle = b.dataset.style;
    if (wt) loadView(currentView, currentArgs);
  })
);

// Navigation: home + the tag index are view resources; the search form issues
// urn:cms:search with the typed term. All go through loadView → the wire → a stylesheet.
$('#nav').querySelectorAll('button[data-view]').forEach((b) =>
  b.addEventListener('click', () => { if (wt) loadView(b.dataset.view); })
);
$('#search').addEventListener('submit', (e) => {
  e.preventDefault();
  const term = $('#q').value.trim();
  if (wt && term) loadView('urn:cms:search', { q: term });
});

// --- passkey identity (rung 3b) ---------------------------------------------
// The room is gated: the server resolves under a public ceiling until a verified passkey
// raises it. The WebAuthn ceremony runs in THIS page's origin (that's where WebAuthn
// binds); the wire just ferries the challenge/assertion to the server's relying party.
async function authCall(iri, args) {
  const resp = await wireCall(encodeIssue(iri, JSON.stringify(args || {})));
  let obj;
  try { obj = JSON.parse(resp); } catch { throw new Error(resp.replace(/<[^>]+>/g, '').trim()); }
  if (obj.error) throw new Error(obj.error);
  return obj;
}

async function passkeyLogin() {
  try {
    setStatus('waiting for passkey…');
    const opts = await authCall('urn:auth:login:start', {});
    const options = PublicKeyCredential.parseRequestOptionsFromJSON(opts.publicKey || opts);
    const assertion = await navigator.credentials.get({ publicKey: options });
    await authCall('urn:auth:login:finish', { credential: JSON.stringify(assertion.toJSON()) });
    signedIn = true;
    setStatus('signed in');
    document.querySelector('.auth').style.display = 'none';
    $('#nav').hidden = false;
    await loadView(currentView, currentArgs);
  } catch (e) { setStatus('sign-in failed: ' + e.message, true); }
}

async function passkeyRegister() {
  try {
    setStatus('creating a passkey…');
    const opts = await authCall('urn:auth:register:start', { name: 'ikigai' });
    const options = PublicKeyCredential.parseCreationOptionsFromJSON(opts.publicKey || opts);
    const cred = await navigator.credentials.create({ publicKey: options });
    await authCall('urn:auth:register:finish', { credential: JSON.stringify(cred.toJSON()) });
    setStatus('passkey enrolled — now sign in');
  } catch (e) { setStatus('registration failed: ' + e.message, true); }
}

async function connectAndLoad(certHex) {
  if (typeof WebTransport === 'undefined') { setStatus('no WebTransport — use Chrome/Edge or Safari 26.4+', true); return; }
  const port = params.get('port') || '4433';
  const url = 'https://127.0.0.1:' + port + '/';
  try {
    setStatus('connecting…');
    wt = new WebTransport(url, { serverCertificateHashes: [{ algorithm: 'sha-256', value: hexToBytes(certHex) }] });
    await wt.ready;
    connect.style.display = 'none';
    setStatus('connected — sign in to read');
    room.innerHTML = '<p style="color:var(--mut)">Sign in with your passkey to read the room. (First run: register a passkey.)</p>';
  } catch (err) {
    setStatus('connect failed: ' + err, true);
  }
}

document.getElementById('signin').addEventListener('click', passkeyLogin);
document.getElementById('register').addEventListener('click', passkeyRegister);

await init();
const certParam = params.get('cert');
if (certParam) {
  connectAndLoad(certParam);
} else {
  $('#cert').addEventListener('change', (e) => { const v = e.target.value.trim(); if (v) connectAndLoad(v); });
}
</script>
</body>
</html>
