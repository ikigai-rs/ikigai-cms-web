<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ikigai — reading room</title>
<!-- The shell's CSS is a file: the page's Content-Security-Policy admits no inline style but the
     views' own blocks, by hash (src/csp.rs). -->
<link rel="stylesheet" href="room.css" />
<!-- htmx runs with eval off: under the page's Content-Security-Policy it could not run one
     anyway, and off means an `hx-on`, a `js:` hx-vals or a trigger filter fails closed. Its
     indicator styles are off too: it injects them as an inline <style>, which the policy refuses,
     and the room uses no htmx indicator. -->
<meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false}' />
<!-- Vendored htmx (self-contained, no CDN). The whole room is htmx attributes over the
     `/r/{iri}` HTTP routes — no custom application JavaScript. -->
<script src="htmx.min.js"></script>
<!-- The one bit of app JS: the standard WebAuthn passkey ceremony (isolated from the room).
     Deferred so the DOM + htmx global are ready when it runs. -->
<script src="auth.js" defer></script>
<!-- Optional WebTransport transport: when a signed-in page can reach cms-server over QUIC, the
     /r/ requests ride the wire instead of HTTP (htmx untouched, HTTP fallback). A module (it
     imports the wasm wire codec); runs after the DOM, like the deferred scripts. -->
<script type="module" src="wire.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>ikigai reading room</h1>
    <!-- Link-check indicator: htmx polls the status resource; shows run progress or the last-run
         tally. Targets itself (not #room). Empty until the first pass. The status is the private
         collection's, so it is gated like the room: auth.js fires `cms:open` once a session
         exists, then `cms:poll` every five seconds while the room is open (a signed-out page
         would otherwise poll a refusal into the header). The interval lives in auth.js rather
         than as an htmx trigger filter, because a filter is evaluated JavaScript, which the
         page's Content-Security-Policy refuses. -->
    <span id="linkcheck" class="linkcheck" hx-get="/r/urn:cms:linkstatus"
          hx-trigger="cms:open, cms:poll"
          hx-target="this"></span>
  </header>

  <!-- Passkey login. Shown until a session is established; auth.js runs the WebAuthn ceremony
       against the /auth/* routes, then reveals the nav + loads the room. -->
  <section id="auth" class="auth" hidden>
    <h2>ikigai reading room</h2>
    <p>A personal semantic library. Sign in with your passkey to enter.</p>
    <button id="auth-login" hidden>Sign in</button>
    <button id="auth-enroll" hidden>Enroll a passkey</button>
    <div id="auth-status" class="auth-status"></div>
  </section>

  <!-- Navigation: every control is vanilla htmx over the /r/ HTTP routes. hx-target/hx-swap
       set here are inherited by the buttons, the search form, AND everything swapped into
       #room (so a card's tag chips and the pager navigate the same way). Hidden until sign-in. -->
  <nav id="nav" class="nav" hx-target="#room" hx-swap="innerHTML" hidden>
    <button hx-get="/r/urn:cms:tags">tags</button>
    <button hx-get="/r/urn:cms:types">types</button>
    <button hx-get="/r/urn:cms:recent">recent</button>
    <button hx-get="/r/urn:cms:review">dead links</button>
    <form hx-get="/r/urn:cms:search">
      <input name="q" type="search" placeholder="search titles…" autocomplete="off" spellcheck="false" />
    </form>
    <span id="wire-status" class="wire-status" aria-live="polite"></span>
    <button id="auth-logout" class="nav-signout" type="button" hidden>sign out</button>
  </nav>

  <!-- The reading room. auth.js loads the tag index once a session exists (so it isn't
       requested before login); each fragment carries its view context as an inherited
       hx-vals wrapper, so paging/tag clicks preserve it. -->
  <div id="room" hx-target="#room" hx-swap="innerHTML"></div>
</div>
</body>
</html>
